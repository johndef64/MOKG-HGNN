[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mokg-hgnn"
version = "1.0.0"
description = "MOKG-HGNN: Multi-scale heterogeneous GNN over a biomedical knowledge graph for pan-cancer molecular subtype prediction"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Giuseppe Laterza" },
]
keywords = ["bioinformatics", "graph-neural-networks", "multi-omics", "tcga", "cancer-subtype"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "matplotlib",
    "seaborn",
    "networkx",
    "statsmodels",
    "pyarrow",
    "pyyaml",
    "openpyxl",
    "torch==2.7.0",
    "torch_geometric==2.7.0",
    "torcheval",
    "termcolor",
    "optuna",
    "wandb",
    "ijson",
    "python-dotenv",
    "gdown",
    "mygene",
    "requests",
]

# The framework lives in src/ (multiomics_kg_hgnn); the MOGNN-TF baseline is
# vendored under benchmark/MOGNN-TF (multiomics_gnn) so it stays importable and
# reproducible as a benchmark. Both are discovered by an editable install.
[tool.setuptools.packages.find]
where = ["src", "benchmark/MOGNN-TF"]
